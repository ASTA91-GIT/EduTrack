<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduTrack – Assignments</title>
  <link rel="stylesheet" href="styles/global.css" />
  <style>
    .container { max-width: 1000px; margin: 2rem auto; padding: 2rem; background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .assignment-card { border: 1px solid #ddd; padding: 1.5rem; margin-bottom: 1rem; border-radius: 8px; border-left: 5px solid #512da8; }
    .assignment-card h3 { margin-bottom: 0.5rem; color: #333; }
    .due-date { color: #f44336; font-weight: bold; }
  </style>
</head>
<body>
  <script src="js/auth.js"></script>
  <script>protectPage();</script>
  
  <header style="padding: 1rem 2rem; background: #512da8; color: white; display: flex; justify-content: space-between;">
    <h2>EduTrack Assignments</h2>
    <a href="#" onclick="window.history.back()" style="color: white; text-decoration: none;">⬅ Back</a>
  </header>

  <div class="container">
    <h2>Pending Assignments</h2>
    <div id="assignmentsList">Loading...</div>
  </div>

  <script>
    async function loadAssignments() {
      try {
        const res = await authFetch(`${API_URL}/v1/academic/assignments`);
        const data = await res.json();
        
        const list = document.getElementById("assignmentsList");
        list.innerHTML = "";
        
        if(data.length === 0) {
          list.innerHTML = "<p>No pending assignments.</p>";
          return;
        }

        data.forEach(a => {
          list.innerHTML += `
            <div class="assignment-card">
              <h3>${a.subject} - ${a.title}</h3>
              <p>Due: <span class="due-date">${new Date(a.due_date).toLocaleString()}</span></p>
            </div>
          `;
        });
      } catch (err) {
        console.error(err);
      }
    }
    loadAssignments();
  </script>
</body>
</html>
