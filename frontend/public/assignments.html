<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignments | EduTrack</title>
  <link rel="stylesheet" href="styles/global.css">
  <link rel="icon" type="image/svg+xml" href="assets/edutrack-icon.svg">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .assignments-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .assignment-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.2s ease;
    }

    .assignment-card:hover {
      border-color: var(--border-strong);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div id="sidebar-mount"></div>

    <main class="main-content">
      <div id="topbar-mount"></div>

      <div class="page-container">
        <div class="page-header">
          <div>
            <h1 class="page-title">Coursework & Assignments</h1>
            <p class="page-subtitle">Track project submissions, deadlines, and academic assignments</p>
          </div>
        </div>

        <div id="assignmentsContainer" class="assignments-grid">
          <div class="card" style="grid-column: 1 / -1;">
            <div class="empty-state">
              <div class="empty-icon-wrap"><i data-lucide="loader-2"></i></div>
              <div class="empty-title">Loading Coursework...</div>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/shell.js"></script>
  <script>
    protectPage();

    document.addEventListener('DOMContentLoaded', async () => {
      initAppShell({
        activePage: 'lectures',
        pageTitle: 'Assignments',
        breadcrumb: 'Assignments'
      });

      await fetchAssignments();
    });

    async function fetchAssignments() {
      try {
        const res = await authFetch('/api/v1/academic/assignments');
        if (!res.ok) throw new Error('Failed to load assignments');
        const list = await res.json();
        renderAssignments(list);
      } catch (err) {
        console.warn('Assignments load notice:', err.message);
        renderEmpty();
      }
    }

    function renderAssignments(items) {
      const container = document.getElementById('assignmentsContainer');
      if (!items || items.length === 0) {
        renderEmpty();
        return;
      }

      container.innerHTML = items.map(a => `
        <div class="assignment-card">
          <div>
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px;">
              <span class="badge badge-primary">${escapeHtml(a.subject)}</span>
              <span class="badge badge-warning">Due Soon</span>
            </div>

            <h3 style="font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 6px;">
              ${escapeHtml(a.title)}
            </h3>

            <div style="display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--danger); margin-bottom: 16px;">
              <i data-lucide="clock" style="width: 14px; height: 14px;"></i>
              <span>Due: ${new Date(a.due_date).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' })}</span>
            </div>
          </div>

          <div style="padding-top: 14px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end;">
            <button class="btn btn-secondary btn-sm" onclick="alert('Submission portal active for ${escapeHtml(a.title)}')">
              <i data-lucide="upload"></i>
              <span>Submit Work</span>
            </button>
          </div>
        </div>
      `).join('');

      lucide.createIcons();
    }

    function renderEmpty() {
      const container = document.getElementById('assignmentsContainer');
      container.innerHTML = `
        <div class="card" style="grid-column: 1 / -1;">
          <div class="empty-state">
            <div class="empty-icon-wrap"><i data-lucide="check-circle-2"></i></div>
            <div class="empty-title">No Pending Assignments</div>
            <div class="empty-subtitle">You have completed all assigned coursework and problem sets.</div>
          </div>
        </div>
      `;
      lucide.createIcons();
    }
  </script>
</body>
</html>
