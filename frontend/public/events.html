<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduTrack – Events</title>
  <link rel="stylesheet" href="styles/global.css" />
  <style>
    .container { max-width: 1000px; margin: 2rem auto; padding: 2rem; background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .event-card { border: 1px solid #ddd; padding: 1.5rem; margin-bottom: 1rem; border-radius: 8px; border-left: 5px solid #ff9800; }
    .event-card h3 { margin-bottom: 0.5rem; color: #333; }
    .event-date { color: #2196f3; font-weight: bold; }
  </style>
</head>
<body>
  <script src="js/auth.js"></script>
  <script>protectPage();</script>
  
  <header style="padding: 1rem 2rem; background: #512da8; color: white; display: flex; justify-content: space-between;">
    <h2>EduTrack Events</h2>
    <a href="#" onclick="window.history.back()" style="color: white; text-decoration: none;">⬅ Back</a>
  </header>

  <div class="container">
    <h2>College Events</h2>
    <div id="eventsList">Loading...</div>
  </div>

  <script>
    async function loadEvents() {
      try {
        const res = await authFetch(`${API_URL}/v1/academic/events`);
        const data = await res.json();
        
        const list = document.getElementById("eventsList");
        list.innerHTML = "";
        
        if(data.length === 0) {
          list.innerHTML = "<p>No upcoming events.</p>";
          return;
        }

        data.forEach(e => {
          list.innerHTML += `
            <div class="event-card">
              <h3>${e.title}</h3>
              <p>${e.description || 'No description provided.'}</p>
              <p>When: <span class="event-date">${new Date(e.event_date).toLocaleString()}</span></p>
            </div>
          `;
        });
      } catch (err) {
        console.error(err);
      }
    }
    loadEvents();
  </script>
</body>
</html>
