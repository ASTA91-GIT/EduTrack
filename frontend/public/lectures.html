<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduTrack – Lectures</title>
  <link rel="stylesheet" href="styles/global.css" />
  <style>
    .container { max-width: 1000px; margin: 2rem auto; padding: 2rem; background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .lecture-card { border: 1px solid #ddd; padding: 1.5rem; margin-bottom: 1rem; border-radius: 8px; border-left: 5px solid #00bcd4; }
    .lecture-card h3 { margin-bottom: 0.5rem; color: #333; }
    .lecture-date { color: #512da8; font-weight: bold; }
  </style>
</head>
<body>
  <script src="js/auth.js"></script>
  <script>protectPage();</script>
  
  <header style="padding: 1rem 2rem; background: #512da8; color: white; display: flex; justify-content: space-between;">
    <h2>EduTrack Lectures</h2>
    <a href="#" onclick="window.history.back()" style="color: white; text-decoration: none;">⬅ Back</a>
  </header>

  <div class="container">
    <h2>Upcoming Lectures</h2>
    <div id="lecturesList">Loading...</div>
  </div>

  <script>
    async function loadLectures() {
      try {
        const res = await authFetch(`${API_URL}/v1/academic/lectures`);
        const data = await res.json();
        
        const list = document.getElementById("lecturesList");
        list.innerHTML = "";
        
        if(data.length === 0) {
          list.innerHTML = "<p>No upcoming lectures found.</p>";
          return;
        }

        data.forEach(l => {
          list.innerHTML += `
            <div class="lecture-card">
              <h3>${l.title} - ${l.subject}</h3>
              <p>Class: ${l.class_name}</p>
              <p>Description: ${l.description || 'N/A'}</p>
              <p>Date: <span class="lecture-date">${new Date(l.lecture_date).toLocaleString()}</span></p>
            </div>
          `;
        });
      } catch (err) {
        console.error(err);
      }
    }
    loadLectures();
  </script>
</body>
</html>
