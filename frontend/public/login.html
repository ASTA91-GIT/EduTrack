<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | EduTrack Academic Portal</title>
  <link rel="stylesheet" href="styles/global.css">
  <link rel="icon" type="image/svg+xml" href="assets/edutrack-icon.svg">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      background: radial-gradient(circle at 10% 20%, rgba(124, 92, 255, 0.08) 0%, transparent 40%),
                  radial-gradient(circle at 90% 80%, rgba(34, 211, 238, 0.06) 0%, transparent 40%),
                  var(--bg);
    }

    .auth-card {
      width: 100%;
      max-width: 440px;
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 36px;
      box-shadow: var(--shadow-lg);
      position: relative;
      z-index: 10;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .auth-brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      text-decoration: none;
    }

    .auth-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.3px;
    }

    .auth-subtitle {
      font-size: 13.5px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .role-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background-color: var(--surface-elevated);
      padding: 4px;
      border-radius: var(--radius-md);
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }

    .role-btn {
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      background: transparent;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .role-btn.active {
      background-color: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow-sm);
    }

    .auth-alert {
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-size: 13px;
      margin-bottom: 18px;
      display: none;
      align-items: center;
      gap: 10px;
    }

    .auth-alert.error {
      display: flex;
      background: var(--danger-glow);
      border: 1px solid var(--danger);
      color: var(--danger);
    }

    .auth-alert.success {
      display: flex;
      background: var(--success-glow);
      border: 1px solid var(--success);
      color: var(--success);
    }

    .auth-footer {
      text-align: center;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      font-size: 13px;
      color: var(--text-secondary);
    }

    .auth-footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }

    .theme-corner-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
    }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="theme-corner-toggle">
      <button class="icon-action-btn" id="themeBtn" title="Toggle Theme" aria-label="Toggle Theme">
        <i data-lucide="sun"></i>
      </button>
    </div>

    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="auth-brand">
          <div class="brand-icon-wrap">
            <i data-lucide="graduation-cap"></i>
          </div>
          <div class="brand-title">Edu<span>Track</span></div>
        </a>
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to your academic command center</p>
      </div>

      <div class="role-toggle">
        <button type="button" class="role-btn active" id="roleStudent" onclick="selectRole('student')">
          <i data-lucide="user"></i>
          <span>Student</span>
        </button>
        <button type="button" class="role-btn" id="roleTeacher" onclick="selectRole('teacher')">
          <i data-lucide="shield-check"></i>
          <span>Faculty</span>
        </button>
      </div>

      <div id="authAlert" class="auth-alert"></div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="email">Institutional Email</label>
          <input type="email" id="email" class="form-control" placeholder="name@edutrack.local" required autocomplete="email" />
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <label class="form-label" for="password">Password</label>
          </div>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password" />
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; margin-top: 8px;">
          <i data-lucide="log-in"></i>
          <span>Sign In</span>
        </button>
      </form>

      <div class="auth-footer">
        Don't have an institutional account? <a href="register.html">Register here</a>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    // Theme sync
    const savedTheme = localStorage.getItem('edutrack_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);

    const themeBtn = document.getElementById('themeBtn');
    themeBtn.addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme') || 'dark';
      const nxt = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', nxt);
      localStorage.setItem('edutrack_theme', nxt);
      themeBtn.innerHTML = `<i data-lucide="${nxt === 'light' ? 'moon' : 'sun'}"></i>`;
      lucide.createIcons();
    });

    let currentRole = 'student';

    function selectRole(role) {
      currentRole = role;
      document.getElementById('roleStudent').classList.toggle('active', role === 'student');
      document.getElementById('roleTeacher').classList.toggle('active', role === 'teacher');
    }

    const loginForm = document.getElementById('loginForm');
    const authAlert = document.getElementById('authAlert');
    const submitBtn = document.getElementById('submitBtn');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      authAlert.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span>Verifying...</span>`;

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const user = await login(email, password, currentRole);
        authAlert.className = 'auth-alert success';
        authAlert.innerHTML = `<i data-lucide="check-circle-2"></i><span>Login successful! Redirecting...</span>`;
        authAlert.style.display = 'flex';
        lucide.createIcons();

        setTimeout(() => {
          if (user.role === 'teacher') {
            window.location.href = 'teacher.html';
          } else {
            window.location.href = 'student.html';
          }
        }, 600);
      } catch (err) {
        authAlert.className = 'auth-alert error';
        authAlert.innerHTML = `<i data-lucide="alert-circle"></i><span>${err.message || 'Invalid credentials'}</span>`;
        authAlert.style.display = 'flex';
        lucide.createIcons();
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<i data-lucide="log-in"></i><span>Sign In</span>`;
        lucide.createIcons();
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) {
        window.lucide.createIcons();
      }
    });
  </script>
</body>
</html>
