<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Students | EduTrack</title>
  <link rel="stylesheet" href="styles/global.css">
  <link rel="icon" type="image/svg+xml" href="assets/edutrack-icon.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>
  <div class="app-container">
    <div id="sidebar-mount"></div>

    <main class="main-content">
      <div id="topbar-mount"></div>

      <div class="page-container">
        <div class="page-header">
          <div>
            <h1 class="page-title">Enrolled Students Directory</h1>
            <p class="page-subtitle">Inspect registered student cohort, attendance status, and institutional profiles</p>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <div class="card-title">
              <i class="fa-solid fa-users"></i>
              <span>All Students</span>
            </div>
            <span class="badge badge-primary" id="studentCountBadge">--</span>
          </div>

          <div class="table-responsive">
            <table class="table" id="studentsTable">
              <thead>
                <tr>
                  <th>Student Name</th>
                  <th>Institutional Email</th>
                  <th>Status</th>
                  <th>Enrollment Date</th>
                </tr>
              </thead>
              <tbody id="studentsTbody">
                <tr>
                  <td colspan="4">
                    <div class="empty-state">
                      <div class="empty-icon-wrap"><i class="fa-solid fa-circle-notch fa-spin"></i></div>
                      <div class="empty-title">Loading Students...</div>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/shell.js"></script>
  <script>
    protectPage(['admin', 'teacher']);

    document.addEventListener('DOMContentLoaded', async () => {
      initAppShell({
        activePage: 'dashboard',
        pageTitle: 'Students',
        breadcrumb: 'Students Directory'
      });

      await loadStudents();
    });

    async function loadStudents() {
      try {
        const res = await authFetch('/api/v1/users/students');
        if (!res.ok) throw new Error('Failed to load students');
        const list = await res.json();
        
        document.getElementById('studentCountBadge').textContent = `${list.length} Enrolled`;
        const tbody = document.getElementById('studentsTbody');

        if (list.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="4">
                <div class="empty-state">
                  <div class="empty-icon-wrap"><i class="fa-solid fa-user-x"></i></div>
                  <div class="empty-title">No Students Registered Yet</div>
                  <div class="empty-subtitle">Student profiles will appear here once registered.</div>
                </div>
              </td>
            </tr>
          `;
          
          return;
        }

        tbody.innerHTML = list.map(s => `
          <tr>
            <td style="font-weight: 600; color: var(--text);">
              <div style="display: flex; align-items: center; gap: 10px;">
                <div class="user-avatar-circle" style="width: 32px; height: 32px; font-size: 12px;">
                  ${(s.name || 'S').charAt(0).toUpperCase()}
                </div>
                <span>${escapeHtml(s.name)}</span>
              </div>
            </td>
            <td>${escapeHtml(s.email)}</td>
            <td>
              <span class="badge ${s.is_active ? 'badge-success' : 'badge-danger'}">
                ${s.is_active ? 'Active' : 'Inactive'}
              </span>
            </td>
            <td>${new Date(s.created_at || Date.now()).toLocaleDateString()}</td>
          </tr>
        `).join('');

        
      } catch (err) {
        console.warn('Student directory error:', err.message);
      }
    }
  </script>
</body>
</html>
