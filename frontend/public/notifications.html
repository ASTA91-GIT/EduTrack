<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications | EduTrack</title>
  <link rel="stylesheet" href="styles/global.css">
  <link rel="icon" type="image/svg+xml" href="assets/edutrack-icon.svg">
  <style>
    .notif-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px 22px;
      margin-bottom: 12px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
      transition: all 0.2s ease;
    }

    .notif-item:hover {
      border-color: var(--border-strong);
    }

    .notif-item.unread {
      border-left: 4px solid var(--primary);
      background: var(--surface-elevated);
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>
  <div class="app-container">
    <div id="sidebar-mount"></div>

    <main class="main-content">
      <div id="topbar-mount"></div>

      <div class="page-container">
        <div class="page-header">
          <div>
            <h1 class="page-title">Notifications & Alerts</h1>
            <p class="page-subtitle">Academic announcements, session alerts, and attendance notifications</p>
          </div>
        </div>

        <div id="notifsContainer" style="max-width: 860px;">
          <div class="card">
            <div class="empty-state">
              <div class="empty-icon-wrap"><i class="fa-solid fa-circle-notch fa-spin"></i></div>
              <div class="empty-title">Loading Notifications...</div>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/shell.js"></script>
  <script>
    protectPage();

    document.addEventListener('DOMContentLoaded', async () => {
      initAppShell({
        activePage: 'notifications',
        pageTitle: 'Notifications',
        breadcrumb: 'Notifications'
      });

      await fetchNotifications();
    });

    async function fetchNotifications() {
      try {
        const res = await authFetch('/api/v1/users/notifications');
        if (!res.ok) throw new Error('Failed to load notifications');
        const list = await res.json();
        renderNotifications(list);
      } catch (err) {
        console.warn('Notification load notice:', err.message);
        renderEmpty();
      }
    }

    function renderNotifications(items) {
      const container = document.getElementById('notifsContainer');
      if (!items || items.length === 0) {
        renderEmpty();
        return;
      }

      container.innerHTML = items.map(n => `
        <div class="notif-item ${!n.is_read ? 'unread' : ''}">
          <div class="stat-icon ${!n.is_read ? 'primary' : 'secondary'}" style="width: 40px; height: 40px;">
            <i class="fa-solid fa-bell" style="width: 20px; height: 20px;"></i>
          </div>
          <div style="flex: 1;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
              <h3 style="font-size: 14.5px; font-weight: 700; color: var(--text);">${escapeHtml(n.title)}</h3>
              <span style="font-size: 11.5px; color: var(--text-muted);">${new Date(n.created_at || Date.now()).toLocaleDateString()}</span>
            </div>
            <p style="font-size: 13px; color: var(--text-secondary); line-height: 1.4;">${escapeHtml(n.message)}</p>
          </div>
        </div>
      `).join('');

      
    }

    function renderEmpty() {
      const container = document.getElementById('notifsContainer');
      container.innerHTML = `
        <div class="card">
          <div class="empty-state">
            <div class="empty-icon-wrap"><i class="fa-solid fa-bell-slash"></i></div>
            <div class="empty-title">No New Notifications</div>
            <div class="empty-subtitle">You are all caught up on academic alerts, announcements, and presence logs.</div>
          </div>
        </div>
      `;
      
    }
  </script>
</body>
</html>
