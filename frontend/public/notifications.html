<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduTrack – Notifications</title>
  <link rel="stylesheet" href="styles/global.css" />
  <style>
    .container { max-width: 1000px; margin: 2rem auto; padding: 2rem; background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .notif-card { border: 1px solid #ddd; padding: 1.5rem; margin-bottom: 1rem; border-radius: 8px; border-left: 5px solid #2196f3; }
    .notif-card.unread { background: #f0f8ff; border-left: 5px solid #f44336; }
    .notif-card h3 { margin-bottom: 0.5rem; color: #333; }
    .timestamp { color: #666; font-size: 0.8rem; }
  </style>
</head>
<body>
  <script src="js/auth.js"></script>
  <script>protectPage();</script>
  
  <header style="padding: 1rem 2rem; background: #512da8; color: white; display: flex; justify-content: space-between;">
    <h2>EduTrack Notifications</h2>
    <a href="#" onclick="window.history.back()" style="color: white; text-decoration: none;">⬅ Back</a>
  </header>

  <div class="container">
    <h2>My Notifications</h2>
    <div id="notifsList">Loading...</div>
  </div>

  <script>
    async function loadNotifs() {
      try {
        const res = await authFetch(`${API_URL}/v1/users/notifications`);
        const data = await res.json();
        
        const list = document.getElementById("notifsList");
        list.innerHTML = "";
        
        if(data.length === 0) {
          list.innerHTML = "<p>No notifications.</p>";
          return;
        }

        data.forEach(n => {
          list.innerHTML += `
            <div class="notif-card ${!n.is_read ? 'unread' : ''}">
              <h3>${n.title}</h3>
              <p>${n.message}</p>
              <p class="timestamp">${new Date(n.created_at).toLocaleString()}</p>
            </div>
          `;
        });
      } catch (err) {
        console.error(err);
      }
    }
    loadNotifs();
  </script>
</body>
</html>
