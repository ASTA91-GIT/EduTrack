<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduTrack | Register</title>

  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="Referrer-Policy" content="no-referrer">
  <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=()">
  
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />

  <!-- Styles -->
  <link rel="stylesheet" href="styles/global.css" />
  <link rel="stylesheet" href="login/mainlogin.css" />

  <link rel="icon" type="image/png" href="images/favicon.png" />
</head>
<body>
  <div class="background-container"></div>
  
  <div class="login-container">
    <form id="registerForm">
      <img src="images/logo.png" alt="EduTrack Logo" class="logo" />

      <h1>Create Account</h1>

      <div class="role-selection">
        <label>
          <input type="radio" name="role" value="teacher" required />
          <i class="fa-solid fa-user-tie"></i> Teacher
        </label>
        <label>
          <input type="radio" name="role" value="student" />
          <i class="fa-solid fa-user-graduate"></i> Student
        </label>
      </div>

      <input type="text" id="regName" placeholder="Full Name" required />
      <input type="email" id="regEmail" placeholder="Institutional Email" required />
      <input type="password" id="regPassword" placeholder="Password" required />

      <button type="submit">Sign Up</button>

      <div style="margin-top: 15px; text-align: center; color: white;">
        Already have an account? <a href="login.html" style="color: #ff9800; text-decoration: none;">Login</a>
      </div>
    </form>
  </div>

  <script src="js/auth.js"></script>
  <script src="login/register.js"></script>
</body>
</html>
