<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tests & Evaluations | EduTrack</title>
  <link rel="stylesheet" href="styles/global.css">
  <link rel="icon" type="image/svg+xml" href="assets/edutrack-icon.svg">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="app-container">
    <div id="sidebar-mount"></div>

    <main class="main-content">
      <div id="topbar-mount"></div>

      <div class="page-container">
        <div class="page-header">
          <div>
            <h1 class="page-title">Tests, Quizzes & Evaluations</h1>
            <p class="page-subtitle">Track upcoming term assessments, midterms, and verified test grades</p>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <div class="card-title">
              <i data-lucide="file-check-2"></i>
              <span>Academic Tests & Performance</span>
            </div>
          </div>

          <div class="table-responsive">
            <table class="table" id="testsTable">
              <thead>
                <tr>
                  <th>Subject</th>
                  <th>Assessment Title</th>
                  <th>Date</th>
                  <th>Score</th>
                  <th>Maximum</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="testsTbody">
                <tr>
                  <td colspan="6">
                    <div class="empty-state">
                      <div class="empty-icon-wrap"><i data-lucide="loader-2"></i></div>
                      <div class="empty-title">Loading Tests...</div>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/shell.js"></script>
  <script>
    protectPage();

    document.addEventListener('DOMContentLoaded', async () => {
      initAppShell({
        activePage: 'lectures',
        pageTitle: 'Tests & Grades',
        breadcrumb: 'Tests'
      });

      await fetchTests();
    });

    async function fetchTests() {
      try {
        const res = await authFetch('/api/v1/academic/tests');
        if (!res.ok) throw new Error('Failed to load tests');
        const list = await res.json();
        const tbody = document.getElementById('testsTbody');

        if (list.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="6">
                <div class="empty-state">
                  <div class="empty-icon-wrap"><i data-lucide="clipboard-x"></i></div>
                  <div class="empty-title">No Tests Scheduled</div>
                  <div class="empty-subtitle">You have no upcoming or graded assessments in the database.</div>
                </div>
              </td>
            </tr>
          `;
          lucide.createIcons();
          return;
        }

        tbody.innerHTML = list.map(t => {
          const hasScore = t.score !== null && t.score !== undefined;
          return `
            <tr>
              <td style="font-weight: 600; color: var(--text);">${escapeHtml(t.subject)}</td>
              <td>${escapeHtml(t.title)}</td>
              <td>${new Date(t.test_date).toLocaleDateString()}</td>
              <td style="font-weight: 700; color: ${hasScore ? 'var(--primary)' : 'var(--text-muted)'};">
                ${hasScore ? t.score : '--'}
              </td>
              <td>${t.max_score}</td>
              <td>
                <span class="badge ${hasScore ? 'badge-success' : 'badge-warning'}">
                  ${hasScore ? 'Graded' : 'Upcoming'}
                </span>
              </td>
            </tr>
          `;
        }).join('');

        lucide.createIcons();
      } catch (err) {
        console.warn('Tests loading notice:', err.message);
      }
    }
  </script>
</body>
</html>
