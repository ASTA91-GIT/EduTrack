<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduTrack – Tests & Grades</title>
  <link rel="stylesheet" href="styles/global.css" />
  <style>
    .container { max-width: 1000px; margin: 2rem auto; padding: 2rem; background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    table { width: 100%; border-collapse: collapse; margin-top: 1.5rem; }
    th, td { padding: 1rem; text-align: left; border-bottom: 1px solid #ddd; }
    th { background: #512da8; color: white; }
    .header-actions { display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>
  <script src="js/auth.js"></script>
  <script>protectPage();</script>
  
  <header style="padding: 1rem 2rem; background: #512da8; color: white; display: flex; justify-content: space-between;">
    <h2>EduTrack Tests</h2>
    <a href="#" onclick="window.history.back()" style="color: white; text-decoration: none;">⬅ Back</a>
  </header>

  <div class="container">
    <div class="header-actions">
      <h2>My Tests & Grades</h2>
    </div>
    
    <table id="testsTable">
      <thead>
        <tr>
          <th>Subject</th>
          <th>Title</th>
          <th>Date</th>
          <th>Score</th>
          <th>Max Score</th>
        </tr>
      </thead>
      <tbody>
        <tr><td colspan="5">Loading...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    async function loadTests() {
      try {
        const res = await authFetch(`${API_URL}/v1/academic/tests`);
        const data = await res.json();
        
        const tbody = document.querySelector("#testsTable tbody");
        tbody.innerHTML = "";
        
        if(data.length === 0) {
          tbody.innerHTML = "<tr><td colspan='5'>No tests found.</td></tr>";
          return;
        }

        data.forEach(t => {
          tbody.innerHTML += `
            <tr>
              <td>${t.subject}</td>
              <td>${t.title}</td>
              <td>${new Date(t.test_date).toLocaleDateString()}</td>
              <td><strong>${t.score !== null ? t.score : 'N/A'}</strong></td>
              <td>${t.max_score}</td>
            </tr>
          `;
        });
      } catch (err) {
        console.error(err);
      }
    }
    loadTests();
  </script>
</body>
</html>
